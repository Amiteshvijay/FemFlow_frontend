name: femflow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.21+21

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  table_calendar: ^3.2.0
  intl: ^0.20.2
  http: ^1.6.0
  app_links: ^6.3.2
  shared_preferences: ^2.5.5
  speech_to_text: ^7.0.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  image_picker: ^1.2.2
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  mime: ^2.0.0
  http_parser: ^4.1.2
  path_provider: ^2.1.5
  universal_html: ^2.2.4
  universal_io: ^2.3.1
  flutter_secure_storage: ^10.1.0
  crypto: ^3.0.7
  provider: ^6.1.5+1
  health: ^13.3.1
  workmanager: ^0.9.0+3
  pdf: ^3.12.0
  google_sign_in: 6.2.1
  googleapis: 13.0.0
  googleapis_auth: 1.6.0
  encrypt: ^5.0.3
  flutter_markdown: ^0.7.5
  package_info_plus: ^9.0.1
  youtube_player_flutter: 9.1.1
  play_install_referrer: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/femflow_app_icon_1024.png"
  adaptive_icon_background: "assets/icons/femflow_app_icon_1024.png"
  adaptive_icon_foreground: "assets/icons/femflow_app_icon_1024.png"
  remove_alpha_ios: true
